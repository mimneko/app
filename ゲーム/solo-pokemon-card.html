const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function makeCard(entry,i){return{id:`${Date.now()}-${i}-${Math.random()}`,name:entry.name,type:entry.type}}
function getArray(zone,slot){if(['deck','hand','discard','side','stadium'].includes(zone))return game[zone];if(zone==='active')return game.active[0];if(zone==='bench')return game.bench[Number(slot)];return null}
function cardElement(card,zone,slot,hidden=false){const el=document.createElement('div');el.className='card'+(hidden?' back':` type-${card.type||'pokemon'}`);el.textContent=hidden?'伏せ札':card.name;el.title=hidden?'伏せ札':`${card.name}（${TYPE_NAMES[card.type]||'未分類'}）`;el.draggable=true;el.addEventListener('dragstart',e=>{e.stopPropagation();e.dataTransfer.setData('text/plain',JSON.stringify({kind:'card',zone,slot,id:card.id}));setTimeout(()=>el.style.opacity='.45',0)});el.addEventListener('dragend',()=>el.style.opacity='');return el}
function resetSlotDamage(zone,index){if(zone==='active'||zone==='bench')game.damage[zone][Number(index)]=0}
function transferStack(from,fromSlot,to){const source=getArray(from,fromSlot),target=getArray(to,null);if(!source||!target||source===target||!source.length)return false;if(to==='stadium'&&target.length)return false;const cards=source.splice(0);if(to==='deck'){target.push(...cards);shuffle(target)}else target.push(...cards);resetSlotDamage(from,fromSlot);render();return true}
function transferHand(to){if(!game.hand.length)return false;if(to==='stadium'&&game.stadium.length)return false;const cards=game.hand.splice(0);if(to==='deck'){game.deck.push(...cards);shuffle(game.deck)}else game[to].push(...cards);render();return true}
function swapBoardSlots(from,fromIndex,to,toIndex){if(!['active','bench'].includes(from)||!['active','bench'].includes(to))return false;const a=getArray(from,fromIndex),b=getArray(to,toIndex);if(!a||!b||a===b)return false;const temp=a.slice();a.splice(0,a.length,...b);b.splice(0,b.length,...temp);const damageA=game.damage[from][Number(fromIndex)],damageB=game.damage[to][Number(toIndex)];game.damage[from][Number(fromIndex)]=damageB;game.damage[to][Number(toIndex)]=damageA;render();return true}
function moveCard(from,fromSlot,id,to,toSlot){const source=getArray(from,fromSlot),target=getArray(to,toSlot);if(!source||!target)return false;const i=source.findIndex(c=>c.id===id);if(i<0||source===target)return false;if(to==='stadium'&&target.length>=1)return false;const [card]=source.splice(i,1);if(!source.length)resetSlotDamage(from,fromSlot);if(to==='deck'){target.unshift(card);shuffle(target)}else target.push(card);render();return true}
function attachDrop(el,zone,slot=null){el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('over')});el.addEventListener('dragleave',()=>el.classList.remove('over'));el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('over');try{const d=JSON.parse(e.dataTransfer.getData('text/plain'));if(d.kind==='hand-stack'){if(zone==='deck'||zone==='discard')transferHand(zone);return}if(d.kind==='slot'){if(zone==='deck'||zone==='discard')transferStack(d.zone,d.slot,zone);else swapBoardSlots(d.zone,d.slot,zone,slot);return}moveCard(d.zone,d.slot,d.id,zone,slot)}catch{}})}
function renderSlot(zone,index,label){const el=document.createElement('div');el.className='slot';const cards=getArray(zone,index);const damage=game.damage[zone][Number(index)]||0;const slotName=label||'ベンチ枠';el.innerHTML=`<div class="slot-head"><span>${label}</span><span class="damage-control"><button class="damage-value" type="button" aria-label="ダメージ ${damage}。クリックで10ずつ増加、ダブルクリックで編集" title="クリックで+10、ダブルクリックで数値を編集">${damage}</button></span><button class="slot-drag" draggable="true" title="カードの束をドラッグ" aria-label="${slotName}をドラッグ">⠿</button></div><div class="slot-cards"></div>`;const host=el.querySelector('.slot-cards');if(cards.length)cards.forEach(c=>host.appendChild(cardElement(c,zone,index)));else host.innerHTML='<span class="slot-empty">カードを置く</span>';const damageButton=el.querySelector('.damage-value');let clickTimer=null;damageButton.addEventListener('click',e=>{e.stopPropagation();if(e.detail>1)return;clickTimer=setTimeout(()=>{game.damage[zone][Number(index)]+=10;render()},250)});damageButton.addEventListener('dblclick',e=>{e.stopPropagation();clearTimeout(clickTimer);const input=document.createElement('input');input.className='damage-input';input.type='number';input.min='0';input.step='10';input.value=game.damage[zone][Number(index)];input.setAttribute('aria-label',`${slotName}のダメージを入力`);damageButton.replaceWith(input);input.focus();input.select();const save=()=>{const value=Number.parseInt(input.value,10);game.damage[zone][Number(index)]=Number.isFinite(value)?Math.max(0,value):0;render()};input.addEventListener('keydown',e=>{if(e.key==='Enter')save();if(e.key==='Escape')render()});input.addEventListener('blur',save)});el.querySelector('.slot-drag').addEventListener('dragstart',e=>{e.stopPropagation();e.dataTransfer.setData('text/plain',JSON.stringify({kind:'slot',zone,slot:index}))});attachDrop(el,zone,index);return el}
function render(){if(!game)return;
$('#count-deck').textContent=game.deck.length;$('#count-hand').textContent=game.hand.length;$('#count-side').textContent=`${game.side.length}枚`;
$('#toggleDeck').textContent=deckFaceUp?'裏にする':'表にする';$('#toggleSide').textContent=sideFaceUp?'裏にする':'表にする';
const deckDisplay=$('#deckDisplay');deckDisplay.innerHTML='';if(deckFaceUp){const list=document.createElement('div');list.className='deck-visible drop-zone';game.deck.forEach(c=>list.appendChild(cardElement(c,'deck',null)));if(!game.deck.length)list.innerHTML='<span class="slot-empty">山札がありません</span>';attachDrop(list,'deck');deckDisplay.appendChild(list)}else{const pile=document.createElement('div');pile.className='deck-stack drop-zone';pile.innerHTML=`<div><strong>伏せ札</strong>${game.deck.length}枚<br><small>クリックでカードを公開</small></div>`;pile.addEventListener('click',()=>{deckFaceUp=true;render()});attachDrop(pile,'deck');deckDisplay.appendChild(pile)}
const sideHost=$('#cards-side');sideHost.innerHTML='';if(game.side.length)game.side.forEach(c=>sideHost.appendChild(cardElement(c,'side',null,!sideFaceUp)));else sideHost.innerHTML='<span class="slot-empty">サイドがありません</span>';
for(const zone of ['active','bench']){const host=$('#slots-'+zone);host.innerHTML='';game[zone].forEach((_,i)=>host.appendChild(renderSlot(zone,i,zone==='active'?'バトル場':'')))}
const stadium=$('#cards-stadium');stadium.innerHTML='';if(game.stadium.length)stadium.appendChild(cardElement(game.stadium[0],'stadium',null));else stadium.innerHTML='<span class="slot-empty">カードを置く</span>';
for(const zone of ['hand','discard']){const host=$('#cards-'+zone);host.innerHTML='';if(game[zone].length)game[zone].forEach(c=>host.appendChild(cardElement(c,zone,null)));else host.innerHTML='<span class="slot-empty">カードを置く</span>'}}
function startGame(opening=false){game={deck:shuffle(deckList.map(makeCard)),hand:[],active:[[]],bench:Array.from({length:5},()=>[]),side:[],discard:[],stadium:[],damage:{active:[0],bench:Array(5).fill(0)}};if(opening){game.hand=game.deck.splice(0,7);game.side=game.deck.splice(0,6)}render()}
function selectDeck(){const chosen=DECKS.find(d=>d.name===$('#deckSelect').value);if(!chosen)return;currentDeck=chosen;deckList=Object.entries(currentDeck.cards).flatMap(([type,cards])=>cards.flatMap(c=>Array.from({length:c.count??1},()=>({...c,type}))));const total=deckList.length;const warning=$('#deckWarning');warning.textContent=total===60?'':`注意：合計${total}枚です（60枚にしてください）`;warning.classList.toggle('hidden',total===60);startGame(false)}
$('#deckSelect').innerHTML=DECKS.map(d=>`<option value="${d.name}">${d.name}</option>`).join('');$('#deckSelect').addEventListener('change',selectDeck);
$('#drawOne').onclick=()=>{if(game.deck.length)game.hand.push(game.deck.shift());render()};$('#drawSeven').onclick=()=>startGame(true);$('#shuffle').onclick=()=>{shuffle(game.deck);render()};$('#toggleDeck').onclick=()=>{deckFaceUp=!deckFaceUp;if(!deckFaceUp)shuffle(game.deck);render()};$('#toggleSide').onclick=()=>{sideFaceUp=!sideFaceUp;render()};
$('#dragHand').addEventListener('dragstart',e=>{e.stopPropagation();e.dataTransfer.setData('text/plain',JSON.stringify({kind:'hand-stack'}))});
for(const zone of ['hand','discard','side','stadium'])attachDrop(document.querySelector(`[data-zone="${zone}"]`),zone);
selectDeck();
})();
</script>
</body></html>
